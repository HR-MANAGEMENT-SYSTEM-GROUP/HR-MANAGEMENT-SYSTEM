<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CoreLink | Employee Tasks</title>


<link 
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
rel="stylesheet">


<link 
rel="stylesheet" 
href="EMP_TASK.css">

</head>


<body>


<nav class="navbar">

<div class="container">

<div>

<h2 class="logo">
CoreLink
</h2>

<small>
Employee Portal
</small>

</div>

</div>

</nav>






<div class="container py-5">



<div class="hero mb-4">


<h1>
My Tasks
</h1>


<p>
Manage your assigned tasks.
</p>


</div>







<!-- Employee Dashboard -->


<div class="row g-4 my-4">



<div class="col-md-3">

<div class="stat-card">


<h6>
Total Tasks
</h6>


<h2 id="empTotalTasks">
0
</h2>


</div>

</div>





<div class="col-md-3">

<div class="stat-card">


<h6>
New Tasks
</h6>


<h2 id="empNewTasks">
0
</h2>


</div>

</div>






<div class="col-md-3">

<div class="stat-card">


<h6>
Submitted
</h6>


<h2 id="empSubmittedTasks">
0
</h2>


</div>

</div>







<div class="col-md-3">

<div class="stat-card">


<h6>
Completed
</h6>


<h2 id="empCompletedTasks">
0
</h2>


</div>

</div>




</div>









<!-- Filters -->


<div class="row mb-4">


<div class="col-md-6">


<label>
Filter By Status
</label>


<select 
id="statusFilter"
class="form-control">


<option value="">
All Status
</option>


<option value="New">
New
</option>


<option value="Submitted">
Submitted
</option>


<option value="Completed">
Completed
</option>


<option value="Not Complete">
Not Complete
</option>


<option value="Blocked">
Blocked
</option>


</select>


</div>







<div class="col-md-6">


<label>
Filter By Task
</label>


<select 
id="employeeTaskFilter"
class="form-control">


<option value="">
All Tasks
</option>


</select>


</div>



</div>









<div class="table-card">


<div class="table-card">


<div id="taskBoard" class="task-board"></div>


</div>


</div>





</div>









<!-- Task View Modal -->


<div class="modal fade" id="taskModal">


<div class="modal-dialog modal-lg">


<div class="modal-content">





<div class="modal-header">


<h4>
Task Details
</h4>


<button 
class="btn-close" 
data-bs-dismiss="modal">
</button>


</div>







<div class="modal-body">



<h3 id="taskTitle"></h3>


<p id="taskDescription"></p>





<p>

<b>
Priority:
</b>


<span id="taskPriority"></span>


</p>






<p>

<b>
Status:
</b>


<span id="taskStatus"></span>


</p>







<p>

<b>
Deadline:
</b>


<span id="taskDeadline"></span>


</p>







<div id="hrFeedback">


</div>









<label>
Solution
</label>



<textarea 

id="solutionText"

class="form-control mb-3">

</textarea>









<label>
Upload File
</label>



<input 

type="file"

id="solutionFile"

class="form-control mb-3">









<label>
Upload Image
</label>



<input 

type="file"

id="solutionImage"

class="form-control mb-3">









<button 

onclick="submitTask()"

class="btn btn-primary"

id="submitButton">


Submit Task


</button>






</div>



</div>



</div>



</div>









<script 

src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">

</script>



<script src="EMP_TASK.js">

</script>



</body>


</html>
